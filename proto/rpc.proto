syntax = "proto3";

package rustvless.rpc.v1;

// NodeControl 是子节点到主节点的长连接控制通道。
// 由节点主动拨号，因此主节点不需要为控制面开放入站端口。
service NodeControl {
  rpc Stream(stream NodeMessage) returns (stream MasterMessage);
}

// Relay 在两个节点之间转发 VLESS 会话。每个节点都提供该服务，
// 因此任意节点都可以作为中转跳。
service Relay {
  rpc Forward(stream RelayPacket) returns (stream RelayPacket);
}

message NodeMessage {
  oneof payload {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    TrafficReport traffic = 3;
    AccessLogBatch access_logs = 4;
    LinkTrafficReport link_traffic = 5;
    UpgradeResult upgrade_result = 6;
  }
}

message MasterMessage {
  oneof payload {
    Accepted accepted = 1;
    ConfigUpdate config = 2;
    TopologyUpdate topology = 3;
    Upgrade upgrade = 4;
  }
}

message Hello {
  string node_id = 1;
  string token = 2;
  string version = 3;
  string http_url = 4;
  string rpc_url = 5;
}

message Accepted {
  int64 server_time_ms = 1;
  string node_name = 2;
  int64 heartbeat_interval_sec = 3;
}

message Heartbeat {
  int64 timestamp_ms = 1;
  uint64 active_connections = 2;
  uint64 uptime_sec = 3;
  int32 cpu_percent = 4;
  uint64 memory_bytes = 5;
}

message TrafficReport {
  repeated UserTraffic users = 1;
}

message UserTraffic {
  string user_id = 1;
  uint64 up_bytes = 2;
  uint64 down_bytes = 3;
}

message AccessLogBatch {
  repeated AccessLog logs = 1;
}

message AccessLog {
  string session_id = 1;
  string user_id = 2;
  string entry_node_id = 3;
  string target = 4;
  string command = 5;
  int64 started_at_ms = 6;
  int64 ended_at_ms = 7;
  uint64 up_bytes = 8;
  uint64 down_bytes = 9;
  string status = 10;
  string error = 11;
  repeated string path = 12;
  string client_addr = 13;
}

message LinkTrafficReport {
  repeated LinkTraffic links = 1;
}

message LinkTraffic {
  string link_id = 1;
  uint64 up_bytes = 2;
  uint64 down_bytes = 3;
  uint64 sessions = 4;
}

message ConfigUpdate {
  repeated VlessUser users = 1;
  int64 revision = 2;
}

message VlessUser {
  string id = 1;
  string name = 2;
  bool enabled = 3;
}

message TopologyUpdate {
  repeated OutboundLink outbound = 1;
  repeated InboundLink inbound = 2;
  int64 revision = 3;
}

message OutboundLink {
  string link_id = 1;
  string to_node_id = 2;
  string to_name = 3;
  string transport = 4;
  string endpoint = 5;
  string token = 6;
  int64 priority = 7;
}

message InboundLink {
  string link_id = 1;
  string from_node_id = 2;
  string token = 3;
  string transport = 4;
}

message RelayPacket {
  oneof payload {
    RelayHello hello = 1;
    RelayReady ready = 2;
    bytes data = 3;
  }
}

message RelayHello {
  string link_token = 1;
  string from_node_id = 2;
  bytes vless_header = 3;
  repeated string visited = 4;
  bool report_traffic = 5;
}

message RelayReady {
  repeated string path = 1;
}

// ---------------------------------------------------------------------------
// Web 管理 RPC
//
// 浏览器控制台通过 gRPC-Web（Connect 客户端）调用主节点。React 应用需要的
// 全部能力都在这里暴露，前端不再依赖 JSON REST；REST 仍保留给脚本使用，
// 两种传输共用同一个服务层，避免行为分叉。
//
// 鉴权：除 Login 外，每个方法都要求 metadata 中的
// `authorization: Bearer <token>`。token 由 Login 签发，不会出现在消息体里。
// ---------------------------------------------------------------------------
service WebAdmin {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(Empty) returns (Empty);
  rpc Me(Empty) returns (AdminView);
  rpc GetStats(Empty) returns (StatsView);

  // 首次安装：未创建任何管理账号时，浏览器通过这两个方法完成初始化。
  rpc GetSetupStatus(Empty) returns (SetupStatus);
  rpc Setup(SetupRequest) returns (LoginResponse);

  // 版本检测与节点批量升级。
  rpc GetVersionInfo(Empty) returns (VersionInfo);
  rpc UpdateAllNodes(UpdateNodesRequest) returns (UpdateNodesResponse);

  // 当前账号的订阅信息（Clash / V2Ray 链接）。
  rpc GetSubscription(Empty) returns (SubscriptionInfo);

  rpc ListNodes(Empty) returns (NodeList);
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (NodeView);
  rpc DeleteNode(DeleteNodeRequest) returns (Empty);

  rpc ListUsers(Empty) returns (UserList);
  rpc CreateUser(CreateUserRequest) returns (ProxyUserView);
  rpc UpdateUser(UpdateUserRequest) returns (ProxyUserView);
  rpc DeleteUser(DeleteUserRequest) returns (Empty);

  rpc ListAdmins(Empty) returns (AdminList);
  rpc CreateAdmin(CreateAdminRequest) returns (AdminView);
  rpc DeleteAdmin(DeleteAdminRequest) returns (Empty);

  rpc ListLinks(Empty) returns (LinkList);
  rpc CreateLink(CreateLinkRequest) returns (LinkView);
  rpc DeleteLink(DeleteLinkRequest) returns (Empty);
  rpc GetTopology(Empty) returns (TopologyResponse);

  rpc ListAccessLogs(AccessLogsRequest) returns (AccessLogPage);
  rpc GetTrafficTopology(TrafficTopologyRequest) returns (TrafficTopologyView);
  rpc GetTrafficOverview(Empty) returns (TrafficOverview);
}

// Empty 用于没有请求或响应负载的方法。
message Empty {}

// WebRole 对应控制面的两种账号级别。
enum WebRole {
  WEB_ROLE_UNSPECIFIED = 0;
  WEB_ROLE_ADMIN = 1;
  WEB_ROLE_USER = 2;
}

// LinkTransport 决定中转跳如何连接下一节点。
enum LinkTransport {
  LINK_TRANSPORT_UNSPECIFIED = 0;
  LINK_TRANSPORT_RPC = 1;
  LINK_TRANSPORT_HTTP = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  AdminView admin = 2;
}

message AdminView {
  string id = 1;
  string email = 2;
  WebRole role = 3;
  // Unix 毫秒时间戳。
  int64 created_at = 4;
}

message AdminList {
  repeated AdminView admins = 1;
}

message StatsView {
  int64 nodes_total = 1;
  int64 nodes_online = 2;
  int64 users_total = 3;
  int64 users_enabled = 4;
  int64 admins_total = 5;
  uint64 up_bytes = 6;
  uint64 down_bytes = 7;
  uint64 active_connections = 8;
  int64 links_total = 9;
}

message NodeView {
  string id = 1;
  string name = 2;
  // "online" 或 "offline"；由实时控制通道推导。
  string status = 3;
  string version = 4;
  string http_url = 5;
  string rpc_url = 6;
  bool is_master = 7;
  // Unix 毫秒时间戳。
  int64 last_seen = 8;
  int64 created_at = 9;
  uint64 active_connections = 10;
  uint64 uptime_sec = 11;
}

message NodeList {
  repeated NodeView nodes = 1;
}

message CreateNodeRequest {
  string name = 1;
}

message CreateNodeResponse {
  NodeView node = 1;
  // 一次性节点 token；返回后无法再次读取。
  string token = 2;
}

// UpdateNodeRequest 使用 optional 字段，允许调用方只更新部分列，
// 与 REST PATCH 语义一致。
message UpdateNodeRequest {
  string id = 1;
  optional string name = 2;
  optional string http_url = 3;
  optional string rpc_url = 4;
}

message DeleteNodeRequest {
  string id = 1;
}

message ProxyUserView {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  string owner_id = 4;
  string owner_email = 5;
  int64 created_at = 6;
  uint64 up_bytes = 7;
  uint64 down_bytes = 8;
}

message UserList {
  repeated ProxyUserView users = 1;
}

message CreateUserRequest {
  string name = 1;
  // 只对 admin 调用方生效；普通用户创建的用户总是归自己所有。
  optional string owner_id = 2;
}

message UpdateUserRequest {
  string id = 1;
  optional string name = 2;
  optional bool enabled = 3;
}

message DeleteUserRequest {
  string id = 1;
}

message CreateAdminRequest {
  string email = 1;
  string password = 2;
  // 未设置时默认为 WEB_ROLE_USER。
  optional WebRole role = 3;
}

message DeleteAdminRequest {
  string id = 1;
}

message LinkView {
  string id = 1;
  string from_node_id = 2;
  string to_node_id = 3;
  string from_name = 4;
  string to_name = 5;
  LinkTransport transport = 6;
  int64 priority = 7;
  bool enabled = 8;
  int64 created_at = 9;
}

message LinkList {
  repeated LinkView links = 1;
}

message CreateLinkRequest {
  string from_node_id = 1;
  string to_node_id = 2;
  // 未指定时默认为 LINK_TRANSPORT_RPC。
  LinkTransport transport = 3;
  int64 priority = 4;
}

message DeleteLinkRequest {
  string id = 1;
}

message TopologyResponse {
  repeated NodeView nodes = 1;
  repeated LinkView links = 2;
}

// AccessLogsRequest 过滤访问日志页；所有条件按 AND 组合，
// 未设置的字段忽略。
message AccessLogsRequest {
  optional string user_id = 1;
  optional string node_id = 2;
  optional string status = 3;
  optional string target = 4;
  optional int64 from = 5;
  optional int64 to = 6;
  optional int64 limit = 7;
  optional int64 offset = 8;
}

message AccessLogView {
  int64 id = 1;
  string session_id = 2;
  string user_id = 3;
  string entry_node_id = 4;
  string target = 5;
  string command = 6;
  int64 started_at = 7;
  int64 ended_at = 8;
  int64 duration_ms = 9;
  uint64 up_bytes = 10;
  uint64 down_bytes = 11;
  string status = 12;
  string error = 13;
  repeated string path = 14;
  string client_addr = 15;
}

message AccessLogPage {
  repeated AccessLogView items = 1;
  int64 total = 2;
  int64 limit = 3;
  int64 offset = 4;
}

message TrafficTopologyRequest {
  // 窗口大小（秒）；服务端限制在 [60, 604800]。
  optional int64 window = 1;
}

message TopologyNodeView {
  string id = 1;
  string name = 2;
  bool is_master = 3;
  bool online = 4;
  uint64 active_connections = 5;
}

message TopologyLinkView {
  string id = 1;
  string from_node_id = 2;
  string to_node_id = 3;
  LinkTransport transport = 4;
  uint64 up_bytes = 5;
  uint64 down_bytes = 6;
  uint64 sessions = 7;
}

message TrafficTopologyView {
  int64 window_sec = 1;
  repeated TopologyNodeView nodes = 2;
  repeated TopologyLinkView links = 3;
}

message TrafficRow {
  string user_id = 1;
  string name = 2;
  string owner_email = 3;
  uint64 up_bytes = 4;
  uint64 down_bytes = 5;
}

message TrafficOverview {
  repeated TrafficRow rows = 1;
}

// Upgrade 指示节点执行自升级脚本，version 为目标版本。
message Upgrade {
  string version = 1;
}

// UpgradeResult 由节点在尝试升级后回报。
// ok=true 表示升级命令已成功启动；下载/替换失败会在 error 中返回。
// 升级是否真正完成，以节点重启后上报的新版本号为准。
message UpgradeResult {
  string version = 1;
  bool ok = 2;
  string error = 3;
}

// SetupStatus 描述主节点是否已完成首次安装。
message SetupStatus {
  bool installed = 1;
  string version = 2;
}

// SetupRequest 是首次安装表单；仅在未安装时可用。
message SetupRequest {
  string email = 1;
  string password = 2;
  string master_name = 3;
  // 启动日志中打印的一次性安装码，防止远程访问者抢先创建管理员。
  string setup_token = 4;
}

// NodeVersionInfo 是单个节点的版本快照。
message NodeVersionInfo {
  string node_id = 1;
  string name = 2;
  string version = 3;
  bool online = 4;
}

// VersionInfo 汇总主节点与所有节点的版本。
message VersionInfo {
  string master_version = 1;
  string latest_version = 2;
  repeated NodeVersionInfo nodes = 3;
}

// UpdateNodesRequest 指定目标版本；为空表示主节点当前版本。
message UpdateNodesRequest {
  string version = 1;
}

// UpdateNodesResponse 返回本次升级的请求数量与在线节点数。
message UpdateNodesResponse {
  uint32 requested = 1;
  uint32 online = 2;
}

// SubscriptionInfo 是当前账号的订阅入口与代理用户。
message SubscriptionInfo {
  string token = 1;
  string v2ray_url = 2;
  string clash_url = 3;
  repeated ProxyUserView users = 4;
}
