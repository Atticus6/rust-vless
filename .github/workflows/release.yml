name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: 读取版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [ -z "$version" ]; then
            echo "version.txt 为空" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 version.txt (${version}) 不一致" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  web:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        working-directory: web
        run: bun install --frozen-lockfile
      - name: 构建
        working-directory: web
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  binaries:
    name: 二进制 ${{ matrix.platform }}
    needs: [version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ''
          - platform: darwin-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            ext: ''
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: 构建
        run: cargo build --release -p rust-vless-master -p rust-vless-node --target ${{ matrix.target }}
      - name: 打包（Unix）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          name="rust-vless-${version}-${{ matrix.platform }}"
          mkdir -p "dist/${name}/web"
          cp "target/${{ matrix.target }}/release/rust-vless-master" "dist/${name}/"
          cp "target/${{ matrix.target }}/release/rust-vless-node" "dist/${name}/"
          cp -r web/dist/. "dist/${name}/web/"
          cp version.txt README.md scripts/install.sh "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $name = "rust-vless-$version-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "dist/$name/web" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rust-vless-master.exe" "dist/$name/"
          Copy-Item "target/${{ matrix.target }}/release/rust-vless-node.exe" "dist/$name/"
          Copy-Item -Recurse -Force "web/dist/*" "dist/$name/web/"
          Copy-Item version.txt, README.md, scripts/install.sh "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-vless-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 3

  release:
    name: 发布
    needs: [version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: rust-vless v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            rust-vless v${{ needs.version.outputs.version }}

            安装：
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```
            主节点首次启动后打开 Web 地址完成安装页面；子节点版本可在大厅「版本」页一键升级。

  docker:
    name: Docker 镜像
    # 等待二进制与 GitHub Release 成功，避免推出没有对应发布产物的镜像。
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: 计算镜像名（GHCR 要求小写）
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 主节点镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: master
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
      - name: 子节点镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: node
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}-node
            ${{ steps.image.outputs.name }}:node
